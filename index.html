<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>🏏 JPNV Sports 2025-26</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏏</text></svg>">
    
    <style>
        /* Critical above-fold CSS only */
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:system-ui,-apple-system,sans-serif;line-height:1.5;color:#1f2937;background:#667eea;min-height:100vh}
        .container{max-width:1200px;margin:0 auto;padding:0 16px}
        .header{background:rgba(255,255,255,0.95);position:sticky;top:0;z-index:100;border-bottom:1px solid #e5e7eb}
        .header-content{display:flex;align-items:center;justify-content:space-between;padding:12px 0}
        .logo{display:flex;align-items:center;gap:12px;font-size:1.5rem;font-weight:700;color:#2563eb;text-decoration:none}
        .nav-menu{display:flex;gap:8px}
        .nav-btn{padding:8px 16px;background:none;border:2px solid #2563eb;border-radius:8px;color:#2563eb;font-weight:500;cursor:pointer;font-size:14px}
        .nav-btn:hover,.nav-btn.active{background:#2563eb;color:white}
        .refresh-btn{padding:8px 12px!important;font-size:16px!important;transition:transform 0.3s ease}
        .refresh-btn:hover{transform:rotate(90deg)}
        .hard-refresh-btn{padding:8px 12px!important;font-size:16px!important;transition:all 0.3s ease;background:linear-gradient(45deg,#ef4444,#f97316)!important;color:white!important;border-color:#dc2626!important}
        .hard-refresh-btn:hover{transform:scale(1.1);box-shadow:0 4px 12px rgba(239,68,68,0.4)}
        @media (max-width:768px){.header-content{flex-wrap:wrap;gap:8px}.logo{flex:1;min-width:0}.nav-menu{gap:4px;flex-wrap:wrap;width:100%;justify-content:space-between}.nav-btn{padding:8px 10px;font-size:12px;min-width:60px;min-height:44px;touch-action:manipulation}.refresh-btn,.hard-refresh-btn{padding:8px 10px!important;font-size:14px!important;min-width:45px!important}}
        .hero-section{text-align:center;padding:40px 0;color:white;margin-bottom:32px}
        .hero-title{font-size:clamp(2rem,5vw,3.5rem);font-weight:700;margin-bottom:16px}
        .hero-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:16px;max-width:600px;margin:0 auto}
        .stat-card{background:rgba(255,255,255,0.2);padding:16px;border-radius:8px}
        .stat-number{font-size:2rem;font-weight:700;color:#f59e0b}
        .loading{text-align:center;padding:40px;color:#fff}
    </style>
    <link rel="preload" href="fast.css?v=1132" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="fast.css?v=1132"></noscript>
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="header-content">
                <a href="#" class="logo">
                    <span style="font-size: clamp(1.5rem, 4vw, 2rem);">🏏</span>
                    <span style="font-size: clamp(1rem, 3vw, 1.5rem);">JPNV Sports</span>
                </a>
                <nav class="nav-menu">
                    <button class="nav-btn active" data-section="matches">Matches</button>
                    <button class="nav-btn" data-section="teams">Teams</button>
                    <button class="nav-btn" data-section="venues">Venues</button>
                    <button class="nav-btn refresh-btn" title="Refresh Data">🔄</button>
                    <button class="nav-btn hard-refresh-btn" title="Hard Refresh (No Cache)">🔥</button>
                </nav>
            </div>
        </div>
    </header>

    <main>
        <div class="container">
            <section class="hero-section">
                <h1 class="hero-title">🏆 JPNV Sports 2025-26</h1>
                <p style="font-size: clamp(1rem, 3vw, 1.5rem); margin-bottom: 24px;">Complete Multi-Sport Championship</p>
                <div class="hero-stats">
                    <div class="stat-card">
                        <div class="stat-number">⏳</div>
                        <div class="stat-label">Matches</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number">⏳</div>
                        <div class="stat-label">Teams</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number">⏳</div>
                        <div class="stat-label">Sports</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number">⏳</div>
                        <div class="stat-label">Venues</div>
                    </div>
                </div>
            </section>

            <section id="matches-section" class="content-section">
                <div class="section-header">
                    <span style="font-size: 1.5rem;">📅</span>
                    <h2 style="font-size: 1.5rem; font-weight: 600;">Match Schedule</h2>
                </div>
                
                <div class="filters">
                    <div class="filter-tabs">
                        <button class="filter-tab active" data-sport="all">All Sports</button>
                        <button class="filter-tab" data-sport="Cricket">🏏 Cricket</button>
                        <button class="filter-tab" data-sport="Football">⚽ Football</button>
                        <button class="filter-tab" data-sport="Basketball">🏀 Basketball</button>
                        <button class="filter-tab" data-sport="Tennis">🎾 Tennis</button>
                        <button class="filter-tab" data-sport="Volleyball">🏐 Volleyball</button>
                        <button class="filter-tab" data-sport="Badminton">🏸 Badminton</button>
                    </div>
                </div>

                <div class="matches-grid" id="matches-grid">
                    <div class="loading">📊 Loading matches...</div>
                </div>
            </section>

            <section id="teams-section" class="content-section" style="display: none;">
                <div class="section-header">
                    <span style="font-size: 1.5rem;">👥</span>
                    <h2 style="font-size: 1.5rem; font-weight: 600;">Teams</h2>
                </div>
                <div class="teams-grid" id="teams-grid"></div>
            </section>

            <section id="venues-section" class="content-section" style="display: none;">
                <div class="section-header">
                    <span style="font-size: 1.5rem;">🏟️</span>
                    <h2 style="font-size: 1.5rem; font-weight: 600;">Venues</h2>
                </div>
                <div class="teams-grid" id="venues-grid"></div>
            </section>
        </div>
    </main>

    <script>
        // Dynamic data loaded from CSV files
        let matches = [];
        let teams = [];
        let venues = [];

        // Data update functions for CSV loader
        window.updateMatchesData = function(csvMatches) {
            matches = csvMatches || [];
            console.log('Matches updated:', matches.length);
            renderMatches();
            updateStats();
        };

        window.updateTeamsData = function(csvTeams) {
            teams = csvTeams || [];
            console.log('Teams updated:', teams.length);
            if (document.querySelector('#teams-section').style.display !== 'none') {
                renderTeams();
            }
            updateStats(); // Update stats when teams load
        };

        window.updateVenuesData = function(csvVenues) {
            venues = csvVenues || [];
            console.log('Venues updated:', venues.length);
            if (document.querySelector('#venues-section').style.display !== 'none') {
                renderVenues();
            }
            updateStats(); // Update stats when venues load
        };

        // Update hero stats with actual data
        function updateStats() {
            const uniqueSports = matches.length > 0 ? new Set(matches.map(m => m.sport)).size : 0;
            const matchCount = matches.length || (matches.length === 0 ? '⏳' : 0);
            const teamCount = teams.length || (teams.length === 0 ? '⏳' : 0);
            const venueCount = venues.length || (venues.length === 0 ? '⏳' : 0);
            const sportCount = uniqueSports || (matches.length === 0 ? '⏳' : 0);
            
            document.querySelector('.hero-stats').innerHTML = `
                <div class="stat-card">
                    <div class="stat-number">${matchCount}</div>
                    <div class="stat-label">Matches</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">${teamCount}</div>
                    <div class="stat-label">Teams</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">${sportCount}</div>
                    <div class="stat-label">Sports</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">${venueCount}</div>
                    <div class="stat-label">Venues</div>
                </div>
            `;
            
            console.log('Stats updated:', { matches: matchCount, teams: teamCount, sports: sportCount, venues: venueCount });
        }

        function formatDate(dateString) {
            return new Date(dateString).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
        }

        function formatTime(timeString) {
            const [hours, minutes] = timeString.split(':');
            const time = new Date();
            time.setHours(hours, minutes);
            return time.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
        }

        function getInitials(name) {
            return name.split(' ').map(word => word[0]).join('').toUpperCase();
        }

        function getSportIcon(sport) {
            const icons = { 'Cricket': '🏏', 'Football': '⚽', 'Basketball': '🏀', 'Tennis': '🎾', 'Volleyball': '🏐', 'Badminton': '🏸' };
            return icons[sport] || '⚽';
        }

        function renderMatches(matchList = matches) {
            const grid = document.getElementById('matches-grid');
            if (matchList.length === 0) {
                grid.innerHTML = matches.length === 0 ? 
                    '<div class="loading">📡 Loading matches from GitHub CSV...<br><small>Please wait while we fetch the latest data</small></div>' : 
                    '<div class="loading">No matches found for selected filter.</div>';
                return;
            }
            grid.innerHTML = matchList.map(match => `
                <div class="match-card">
                    <div class="match-header">
                        <span style="font-weight: 600;">${formatDate(match.date)}</span>
                        <span class="match-sport sport-${match.sport.toLowerCase()}">${getSportIcon(match.sport)} ${match.sport}</span>
                    </div>
                    <div class="match-content">
                        <div class="match-teams">
                            <div class="team">
                                <div class="team-logo">${getInitials(match.homeTeam)}</div>
                                <div class="team-name">${match.homeTeam}</div>
                            </div>
                            <div class="vs-divider">VS</div>
                            <div class="team">
                                <div class="team-logo">${getInitials(match.awayTeam)}</div>
                                <div class="team-name">${match.awayTeam}</div>
                            </div>
                        </div>
                        <div class="match-details">
                            <div>🕒 ${formatTime(match.time)}</div>
                            <div>🏟️ ${match.venue}</div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function renderTeams() {
            if (!teams || teams.length === 0) {
                document.getElementById('teams-grid').innerHTML = '<div class="loading">Loading teams...</div>';
                return;
            }
            document.getElementById('teams-grid').innerHTML = teams.map(team => `
                <div class="team-card">
                    <div class="team-card-logo">${getInitials(team.name)}</div>
                    <div style="font-size: 1.25rem; font-weight: 600; margin-bottom: 8px;">${team.name}</div>
                    <div style="color: #6b7280; margin-bottom: 12px;">${getSportIcon(team.sport)} ${team.sport}</div>
                    <div style="font-size: 14px; margin-bottom: 4px;">🏆 ${team.division || 'Division'}</div>
                    <div style="font-size: 14px; margin-bottom: 4px;">👤 ${team.contact || 'Contact'}</div>
                    <div style="font-size: 14px; margin-bottom: 4px;">📧 ${team.email || ''}</div>
                    <div style="font-size: 14px; margin-bottom: 4px;">🏟️ ${team.venue || 'Home Venue'}</div>
                    ${team.color ? `<div style="font-size: 12px; color: #6b7280;">🎨 ${team.color}</div>` : ''}
                </div>
            `).join('');
        }

        function renderVenues() {
            if (!venues || venues.length === 0) {
                document.getElementById('venues-grid').innerHTML = '<div class="loading">Loading venues...</div>';
                return;
            }
            document.getElementById('venues-grid').innerHTML = venues.map(venue => `
                <div class="team-card">
                    <div class="team-card-logo">🏟️</div>
                    <div style="font-size: 1.25rem; font-weight: 600; margin-bottom: 8px;">${venue.name}</div>
                    <div style="color: #6b7280; margin-bottom: 12px;">${venue.city}${venue.state ? `, ${venue.state}` : ''}</div>
                    <div style="font-size: 14px; margin-bottom: 4px;">👥 Capacity: ${venue.capacity ? venue.capacity.toLocaleString() : 'N/A'}</div>
                    <div style="font-size: 14px; margin-bottom: 4px;">🌿 ${venue.surface || 'Surface'}</div>
                    <div style="font-size: 14px; margin-bottom: 4px;">🏢 ${venue.type || 'Type'}</div>
                    ${venue.contact ? `<div style="font-size: 14px;">📞 ${venue.contact}</div>` : ''}
                </div>
            `).join('');
        }

        // Navigation
        document.querySelectorAll('.nav-btn').forEach(btn => {
            btn.onclick = function() {
                // Handle hard refresh button
                if (this.classList.contains('hard-refresh-btn')) {
                    this.style.transform = 'scale(0.9)';
                    this.style.transition = 'transform 0.2s ease';
                    setTimeout(() => {
                        this.style.transform = '';
                    }, 200);
                    
                    // Clear all data and reset to loading states
                    matches = [];
                    teams = [];
                    venues = [];
                    
                    // Reset all sections to loading
                    document.getElementById('matches-grid').innerHTML = '<div class="loading">🔥 Hard refreshing matches...</div>';
                    document.getElementById('teams-grid').innerHTML = '<div class="loading">🔥 Hard refreshing teams...</div>';
                    document.getElementById('venues-grid').innerHTML = '<div class="loading">🔥 Hard refreshing venues...</div>';
                    
                    // Reset hero stats to loading
                    document.querySelector('.hero-stats').innerHTML = `
                        <div class="stat-card"><div class="stat-number">⏳</div><div class="stat-label">Matches</div></div>
                        <div class="stat-card"><div class="stat-number">⏳</div><div class="stat-label">Teams</div></div>
                        <div class="stat-card"><div class="stat-number">⏳</div><div class="stat-label">Sports</div></div>
                        <div class="stat-card"><div class="stat-number">⏳</div><div class="stat-label">Venues</div></div>
                    `;
                    
                    // Force hard refresh with timestamp and cache busting headers
                    const timestamp = new Date().getTime();
                    const s = document.createElement('script');
                    s.src = `js/mini-csv.js?nocache=${timestamp}&t=${timestamp}`;
                    s.async = true;
                    // Remove any existing CSV loader scripts
                    document.querySelectorAll('script[src*="mini-csv"]').forEach(el => el.remove());
                    document.head.appendChild(s);
                    
                    console.log('🔥 Hard refresh initiated - bypassing all cache');
                    return;
                }
                
                // Handle regular refresh button
                if (this.classList.contains('refresh-btn')) {
                    this.style.transform = 'rotate(360deg)';
                    this.style.transition = 'transform 0.5s ease';
                    setTimeout(() => {
                        this.style.transform = '';
                        this.style.transition = '';
                    }, 500);
                    
                    // Refresh current section and reload CSV data
                    const activeSection = document.querySelector('.nav-btn.active')?.dataset.section;
                    if (activeSection === 'matches') {
                        document.getElementById('matches-grid').innerHTML = '<div class="loading">🔄 Refreshing matches...</div>';
                    } else if (activeSection === 'teams') {
                        document.getElementById('teams-grid').innerHTML = '<div class="loading">🔄 Refreshing teams...</div>';
                    } else if (activeSection === 'venues') {
                        document.getElementById('venues-grid').innerHTML = '<div class="loading">🔄 Refreshing venues...</div>';
                    }
                    
                    // Reload CSV data with cache busting
                    const timestamp = new Date().getTime();
                    const s = document.createElement('script');
                    s.src = `js/mini-csv.js?v=${timestamp}`;
                    s.async = true;
                    document.head.appendChild(s);
                    return;
                }
                
                document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                
                document.querySelectorAll('.content-section').forEach(s => s.style.display = 'none');
                document.getElementById(this.dataset.section + '-section').style.display = 'block';
                
                if (this.dataset.section === 'matches') {
                    if (matches.length === 0) {
                        document.getElementById('matches-grid').innerHTML = '<div class="loading">📊 Loading matches from CSV...</div>';
                    }
                }
                if (this.dataset.section === 'teams') renderTeams();
                if (this.dataset.section === 'venues') renderVenues();
            };
        });

        // Sport filters
        document.querySelectorAll('.filter-tab').forEach(tab => {
            tab.onclick = function() {
                document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
                this.classList.add('active');
                
                const sport = this.dataset.sport;
                const filtered = sport === 'all' ? matches : matches.filter(match => match.sport === sport);
                renderMatches(filtered);
            };
        });

        // Load remaining styles after initial paint
        setTimeout(() => {
            const style = document.createElement('style');
            style.textContent = `
                body{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%)}
                .content-section{background:white;border-radius:8px;box-shadow:0 4px 6px -1px rgba(0,0,0,0.1);margin-bottom:24px;overflow:hidden}
                .section-header{background:linear-gradient(135deg,#2563eb,#1e40af);color:white;padding:20px 24px;display:flex;align-items:center;gap:12px}
                .filters{padding:20px 24px;border-bottom:1px solid #e5e7eb;background:#f8fafc}
                .filter-tabs{display:flex;gap:8px;flex-wrap:wrap}
                .filter-tab{padding:8px 16px;background:white;border:2px solid #e5e7eb;border-radius:20px;cursor:pointer;font-size:14px;font-weight:500}
                .filter-tab:hover,.filter-tab.active{background:#2563eb;color:white;border-color:#2563eb}
                .matches-grid{padding:24px;display:grid;gap:16px}
                .match-card{border:1px solid #e5e7eb;border-radius:8px;overflow:hidden;background:white}
                .match-header{background:#f3f4f6;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
                .match-sport{padding:4px 12px;border-radius:12px;font-size:12px;font-weight:600}
                .sport-cricket{background:#dbeafe;color:#1e40af}.sport-football{background:#dcfce7;color:#166534}.sport-basketball{background:#fed7aa;color:#c2410c}.sport-tennis{background:#fce7f3;color:#be185d}.sport-volleyball{background:#f0fdf4;color:#15803d}.sport-badminton{background:#fef3c7;color:#d97706}
                .match-content{padding:16px}
                .match-teams{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
                .team{text-align:center;flex:1}.team-name{font-weight:600;margin-bottom:4px}
                .team-logo{width:40px;height:40px;background:linear-gradient(135deg,#2563eb,#1e40af);border-radius:50%;display:flex;align-items:center;justify-content:center;color:white;font-weight:700;margin:0 auto 8px}
                .vs-divider{font-weight:700;color:#6b7280;margin:0 16px}
                .match-details{display:grid;grid-template-columns:1fr 1fr;gap:12px;font-size:14px;color:#6b7280}
                .teams-grid{padding:24px;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px}
                .team-card{background:white;border:1px solid #e5e7eb;border-radius:8px;padding:20px;text-align:center}
                .team-card-logo{width:60px;height:60px;background:linear-gradient(135deg,#2563eb,#1e40af);border-radius:50%;display:flex;align-items:center;justify-content:center;color:white;font-weight:700;font-size:1.5rem;margin:0 auto 16px}
                @media (max-width:768px){.container{padding:0 12px}.hero-section{padding:24px 0}.matches-grid,.teams-grid{padding:16px}.match-details{grid-template-columns:1fr}.teams-grid{grid-template-columns:1fr}.match-teams{flex-direction:column;gap:12px}.vs-divider{margin:8px 0}.header-content{padding:8px 0!important}.nav-menu{justify-content:center;width:100%;margin-top:8px}.nav-btn{flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}}
            `;
            document.head.appendChild(style);
        }, 50);

        // Load mini CSV in background  
        setTimeout(() => {
            const s = document.createElement('script');
            s.src = 'js/mini-csv.js?v=1132';
            s.async = true;
            document.head.appendChild(s);
        }, 300);

        // Initialize with detailed loading states
        document.getElementById('matches-grid').innerHTML = '<div class="loading">📊 Loading 20+ matches from GitHub CSV...</div>';
        
        // Show loading feedback in console
        console.log('🚀 JPNV Sports initializing...');
        console.log('📡 Loading CSV data from GitHub...');
        
        // Initial render after CSV loads
        renderMatches();
    </script>
</body>
</html>
