    <style>
        :root {
            --primary-color: #2563eb;
            --secondary-color: #1e40af;
            --accent-color: #f59e0b;
            --success-color: #10b981;
            --danger-color: #ef4444;
            --warning-color: #f59e0b;
            --info-color: #06b6d4;
            --dark-color: #1f2937;
            --light-color: #f8fafc;
            --text-primary: #1f2937;
            --text-secondary: #6b7280;
            --border-color: #e5e7eb;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            --border-radius: 8px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            line-height: 1.6;
            color: var(--text-primary);
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 16px;
        }

        /* Header Styles */
        .header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border-color);
            box-shadow: var(--shadow-sm);
        }

        .header-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 0;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary-color);
            text-decoration: none;
        }

        .logo-icon {
            font-size: 2rem;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-10px); }
            60% { transform: translateY(-5px); }
        }

        .nav-menu {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .nav-btn {
            padding: 8px 16px;
            background: none;
            border: 2px solid var(--primary-color);
            border-radius: var(--border-radius);
            color: var(--primary-color);
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            font-size: 14px;
        }

        .nav-btn:hover {
            background: var(--primary-color);
            color: white;
            transform: translateY(-1px);
        }

        .nav-btn.active {
            background: var(--primary-color);
            color: white;
        }

        /* Main Content */
        .main-content {
            padding: 24px 0;
        }

        .hero-section {
            text-align: center;
            padding: 40px 0;
            color: white;
            margin-bottom: 32px;
        }

        .hero-title {
            font-size: clamp(2rem, 5vw, 3.5rem);
            font-weight: 700;
            margin-bottom: 16px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .hero-subtitle {
            font-size: clamp(1rem, 3vw, 1.5rem);
            margin-bottom: 24px;
            opacity: 0.9;
        }

        .hero-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 16px;
            max-width: 600px;
            margin: 0 auto;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            padding: 16px;
            border-radius: var(--border-radius);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .stat-number {
            font-size: 2rem;
            font-weight: 700;
            color: var(--accent-color);
        }

        .stat-label {
            font-size: 0.875rem;
            opacity: 0.9;
        }

        /* Content Cards */
        .content-section {
            background: white;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-lg);
            margin-bottom: 24px;
            overflow: hidden;
        }

        .section-header {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            padding: 20px 24px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .section-title {
            font-size: 1.5rem;
            font-weight: 600;
        }

        .section-icon {
            font-size: 1.5rem;
        }

        .filters {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border-color);
            background: #f8fafc;
        }

        .filter-tabs {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .filter-tab {
            padding: 8px 16px;
            background: white;
            border: 2px solid var(--border-color);
            border-radius: 20px;
            cursor: pointer;
            transition: var(--transition);
            font-size: 14px;
            font-weight: 500;
        }

        .filter-tab:hover {
            border-color: var(--primary-color);
            transform: translateY(-1px);
        }

        .filter-tab.active {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        /* Match Cards */
        .matches-grid {
            padding: 24px;
            display: grid;
            gap: 16px;
        }

        .match-card {
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            overflow: hidden;
            transition: var(--transition);
            background: white;
        }

        .match-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .match-header {
            background: linear-gradient(135deg, #f3f4f6, #e5e7eb);
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .match-date {
            font-weight: 600;
            color: var(--text-primary);
        }

        .match-sport {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .sport-cricket { background: #dbeafe; color: #1e40af; }
        .sport-football { background: #dcfce7; color: #166534; }
        .sport-basketball { background: #fed7aa; color: #c2410c; }
        .sport-tennis { background: #fce7f3; color: #be185d; }

        .match-content {
            padding: 16px;
        }

        .match-teams {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .team {
            text-align: center;
            flex: 1;
        }

        .team-name {
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .team-logo {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            margin: 0 auto 8px;
        }

        .vs-divider {
            font-weight: 700;
            color: var(--text-secondary);
            margin: 0 16px;
        }

        .match-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            font-size: 14px;
        }

        .detail-item {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-secondary);
        }

        .detail-icon {
            font-size: 16px;
        }

        /* Teams Section */
        .teams-grid {
            padding: 24px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .team-card {
            background: white;
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            padding: 20px;
            text-align: center;
            transition: var(--transition);
        }

        .team-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .team-card-logo {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            font-size: 1.5rem;
            margin: 0 auto 16px;
        }

        .team-card-name {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .team-card-sport {
            color: var(--text-secondary);
            margin-bottom: 12px;
        }

        .team-card-details {
            display: grid;
            gap: 8px;
            font-size: 14px;
            text-align: left;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .container {
                padding: 0 12px;
            }

            .header-content {
                padding: 8px 0;
            }

            .logo {
                font-size: 1.25rem;
            }

            .nav-menu {
                gap: 4px;
            }

            .nav-btn {
                padding: 6px 12px;
                font-size: 12px;
            }

            .hero-section {
                padding: 24px 0;
            }

            .main-content {
                padding: 16px 0;
            }

            .matches-grid,
            .teams-grid {
                padding: 16px;
            }

            .match-details {
                grid-template-columns: 1fr;
                gap: 8px;
            }

            .teams-grid {
                grid-template-columns: 1fr;
            }

            .filter-tabs {
                justify-content: center;
            }

            .match-teams {
                flex-direction: column;
                gap: 12px;
            }

            .vs-divider {
                margin: 8px 0;
            }
        }

        @media (max-width: 480px) {
            .hero-stats {
                grid-template-columns: repeat(2, 1fr);
            }

            .stat-card {
                padding: 12px;
            }

            .stat-number {
                font-size: 1.5rem;
            }
        }

        /* Loading Animation */
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Mobile-specific optimizations */
        @media (max-width: 480px) {
            .app-header h1 {
                font-size: 1.4rem;
            }
            
            .nav-container {
                padding: 0 10px;
            }
            
            .nav-btn {
                padding: 8px 12px;
                font-size: 0.8rem;
                min-width: auto;
            }
            
            .filter-container {
                flex-direction: column;
                gap: 8px;
                padding: 12px;
            }
            
            .filter-tab {
                padding: 6px 12px;
                font-size: 0.8rem;
            }
            
            .match-card {
                padding: 12px;
                margin-bottom: 8px;
            }
            
            .match-teams {
                font-size: 0.9rem;
            }
            
            .match-details {
                font-size: 0.75rem;
            }
            
            .team-card, .venue-card {
                padding: 12px;
            }
            
            .team-name, .venue-name {
                font-size: 1rem;
            }
        }

        /* Touch-friendly interactions */
        .touch-feedback {
            transform: scale(0.98);
            transition: transform 0.1s ease;
        }
        
        .match-card:active,
        .nav-btn:active,
        .filter-tab:active {
            transform: scale(0.98);
        }

        /* PWA specific styles */
        .install-prompt {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            padding: 16px;
            border-radius: 12px;
            margin: 16px;
            text-align: center;
            box-shadow: var(--shadow-lg);
        }
        
        .install-prompt button {
            background: white;
            color: var(--primary-color);
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            margin-top: 8px;
            cursor: pointer;
            transition: var(--transition);
        }
        
        .install-prompt button:hover {
            transform: translateY(-1px);
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        /* Skeleton loading states */
        .skeleton {
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }
        
        .skeleton-match {
            height: 120px;
            border-radius: 12px;
            margin-bottom: 16px;
        }
        
        .skeleton-team {
            height: 80px;
            border-radius: 8px;
            margin-bottom: 12px;
        }
        
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        /* Improved accessibility */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
        
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #121212;
                --card-bg: #1e1e1e;
                --text-color: #ffffff;
                --text-secondary: #b3b3b3;
                --border-color: #333333;
            }
            
            .skeleton {
                background: linear-gradient(90deg, #2a2a2a 25%, #1a1a1a 50%, #2a2a2a 75%);
                background-size: 200% 100%;
            }
        }

        /* Offline indicator */
        .offline-indicator {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: #ff4444;
            color: white;
            text-align: center;
            padding: 8px;
            font-size: 0.8rem;
            font-weight: 500;
            z-index: 10000;
            transform: translateY(-100%);
            transition: transform 0.3s ease;
        }
        
        .offline-indicator.show {
            transform: translateY(0);
        }

        /* Pull-to-refresh indicator */
        .pull-refresh-indicator {
            position: fixed;
            top: -50px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.8rem;
            z-index: 1000;
            transition: top 0.3s ease;
        }

        /* Accessibility */
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        /* Focus styles */
        .nav-btn:focus,
        .filter-tab:focus {
            outline: 2px solid var(--primary-color);
            outline-offset: 2px;
        }

        /* Print styles */
        @media print {
            .header,
            .filters {
                display: none;
            }
            
            .match-card {
                break-inside: avoid;
                margin-bottom: 10px;
            }
        }
    </style>
</head>

        <div class="container">

        // Utility functions
        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('en-US', { 
                weekday: 'short', 
                month: 'short', 
                day: 'numeric' 
            });
        }

        function formatTime(timeString) {
            const [hours, minutes] = timeString.split(':');
            const time = new Date();
            time.setHours(hours, minutes);
            return time.toLocaleTimeString('en-US', { 
                hour: 'numeric', 
                minute: '2-digit',
                hour12: true 
            });
        }

        function getTeamInitials(teamName) {
            return teamName.split(' ').map(word => word[0]).join('').toUpperCase();
        }

        function getSportIcon(sport) {
            const icons = {
                'Cricket': '🏏',
                'Football': '⚽',
                'Basketball': '🏀',
                'Tennis': '🎾'
            };
            return icons[sport] || '⚽';
        }

            document.body.appendChild(installBtn);

            installBtn.addEventListener('click', async () => {
                if (deferredPrompt) {
                    deferredPrompt.prompt();

                    if (outcome === 'accepted') {
                        console.log('JPNV Sports: PWA installed');

                    deferredPrompt = null;

        // Mobile-specific features
        function initMobileFeatures() {
            // Pull-to-refresh
            let startY = 0;
            let pullDistance = 0;
            const threshold = 100;
            
            document.addEventListener('touchstart', (e) => {
                if (window.scrollY === 0) {
                    startY = e.touches[0].pageY;
                }
            });
            
            document.addEventListener('touchmove', (e) => {
                if (window.scrollY === 0 && startY) {
                    pullDistance = e.touches[0].pageY - startY;
                    
                    if (pullDistance > 0) {
                        e.preventDefault();
                        document.body.style.transform = `translateY(${Math.min(pullDistance / 3, 50)}px)`;
                    }
                }
            });
            
            document.addEventListener('touchend', () => {
                if (pullDistance > threshold) {
                    showToast('🔄 Refreshing match data...');
                    setTimeout(() => {
                        window.location.reload();
                    }, 500);
                }
                
                document.body.style.transform = '';
                startY = 0;
                pullDistance = 0;
            });
            
            // Swipe navigation for mobile
            let touchStartX = 0;
            let touchStartY = 0;
            
            document.addEventListener('touchstart', (e) => {
                touchStartX = e.changedTouches[0].screenX;
                touchStartY = e.changedTouches[0].screenY;
            });
            
            document.addEventListener('touchend', (e) => {
                const touchEndX = e.changedTouches[0].screenX;
                const touchEndY = e.changedTouches[0].screenY;
                
                const diffX = touchStartX - touchEndX;
                const diffY = touchStartY - touchEndY;
                
                // Horizontal swipe detection
                if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > 50) {
                    const sections = ['matches', 'teams', 'venues'];
                    const currentSection = document.querySelector('.nav-btn.active').dataset.section;
                    const currentIndex = sections.indexOf(currentSection);
                    
                    if (diffX > 0 && currentIndex < sections.length - 1) {
                        // Swipe left - next section
                        document.querySelector(`[data-section="${sections[currentIndex + 1]}"]`).click();
                    } else if (diffX < 0 && currentIndex > 0) {
                        // Swipe right - previous section  
                        document.querySelector(`[data-section="${sections[currentIndex - 1]}"]`).click();
                    }
                }
            });
            
            // Haptic feedback for supported devices
            if ('vibrate' in navigator) {
                document.addEventListener('click', (e) => {
                    if (e.target.matches('.nav-btn, .filter-tab, .match-card')) {
                        navigator.vibrate(10); // Light haptic feedback
                    }
                });
            }
        }

        // Network monitoring
        function initNetworkMonitoring() {
            const offlineIndicator = document.createElement('div');
            offlineIndicator.className = 'offline-indicator';
            offlineIndicator.textContent = '📡 No internet connection - Using cached data';
            document.body.appendChild(offlineIndicator);

            function updateConnectionStatus() {
                if (navigator.onLine) {
                    offlineIndicator.classList.remove('show');
                } else {
                    offlineIndicator.classList.add('show');
                }
            }

            window.addEventListener('online', updateConnectionStatus);
            window.addEventListener('offline', updateConnectionStatus);
            updateConnectionStatus();
        }

        // Enhanced data management with caching
        function cacheData(key, data) {
            try {
                localStorage.setItem(`jpnv_${key}`, JSON.stringify({
                    data: data,
                    timestamp: Date.now(),
                    version: '1.0.0'
                }));
            } catch (e) {
                console.warn('JPNV Sports: Storage quota exceeded');
            }
        }

        function getCachedData(key, maxAge = 24 * 60 * 60 * 1000) { // 24 hours default
            try {
                const cached = localStorage.getItem(`jpnv_${key}`);
                if (cached) {
                    const parsed = JSON.parse(cached);
                    if (Date.now() - parsed.timestamp < maxAge) {
                        return parsed.data;
                    }
                }
            } catch (e) {
                console.warn('JPNV Sports: Error reading cached data');
            }
            return null;
        }

        // Enhanced match rendering with caching
        function renderMatchesWithCache() {
            const matchesGrid = document.getElementById('matches-grid');
            
            // Try to load cached data first
            const cachedMatches = getCachedData('matches');
            if (cachedMatches) {
                renderMatches(cachedMatches);
                console.log('JPNV Sports: Loaded matches from cache');
            } else {
                // Show skeleton loading
                matchesGrid.innerHTML = Array.from({length: 6}, () => 
                    '<div class="skeleton skeleton-match"></div>'
                ).join('');
                
                // Simulate API loading then render actual data
                setTimeout(() => {
                    renderMatches();
                    cacheData('matches', jpnvMatchSchedule);
                }, 800);
            }
        }

        // Enhanced search and filtering
        function enhancedSearch() {
            const searchInput = document.createElement('input');
            searchInput.type = 'text';
            searchInput.placeholder = '🔍 Search matches, teams, or venues...';
            searchInput.style.cssText = `

            `;

            // Insert search after header
            const header = document.querySelector('.app-header');
            header.after(searchInput);

            let searchTimeout;
            searchInput.addEventListener('input', (e) => {
                clearTimeout(searchTimeout);
                searchTimeout = setTimeout(() => {
                    const query = e.target.value.toLowerCase().trim();
                    filterBySearch(query);
                }, 300);
            });

        function filterBySearch(query) {
            const currentSection = document.querySelector('.nav-btn.active').dataset.section;
            
            if (query === '') {
                // Reset to show all
                if (currentSection === 'matches') renderMatches();
                else if (currentSection === 'teams') renderTeams();
                else if (currentSection === 'venues') renderVenues();
                return;
            }

            if (currentSection === 'matches') {
                const filtered = jpnvMatchSchedule.filter(match => 
                    match.home_team.toLowerCase().includes(query) ||
                    match.away_team.toLowerCase().includes(query) ||
                    match.sport.toLowerCase().includes(query) ||
                    match.venue.toLowerCase().includes(query)
                );
                renderMatches(filtered);
            } else if (currentSection === 'teams') {
                const filtered = jpnvTeamsInformation.filter(team => 
                    team.team_name.toLowerCase().includes(query) ||
                    team.coach.toLowerCase().includes(query) ||
                    team.sport.toLowerCase().includes(query)
                );
                renderTeams(filtered);
            } else if (currentSection === 'venues') {
                const filtered = jpnvVenuesList.filter(venue => 
                    venue.venue_name.toLowerCase().includes(query) ||
                    venue.location.toLowerCase().includes(query)
                );
                renderVenues(filtered);
            }
        }

        // Quick stats dashboard
        function addQuickStats() {
            const statsContainer = document.createElement('div');
            statsContainer.innerHTML = `
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(80px, 1fr)); gap: 12px; padding: 16px; background: var(--card-bg); margin: 16px; border-radius: 12px; box-shadow: var(--shadow-sm);">
                    <div style="text-align: center;">
                        <div style="font-size: 1.5rem; font-weight: 700; color: var(--primary-color);">${jpnvMatchSchedule.length}</div>
                        <div style="font-size: 0.7rem; color: var(--text-secondary); text-transform: uppercase; font-weight: 600;">Total Matches</div>
                    </div>
                    <div style="text-align: center;">
                        <div style="font-size: 1.5rem; font-weight: 700; color: var(--secondary-color);">${jpnvTeamsInformation.length}</div>
                        <div style="font-size: 0.7rem; color: var(--text-secondary); text-transform: uppercase; font-weight: 600;">Teams</div>
                    </div>
                    <div style="text-align: center;">
                        <div style="font-size: 1.5rem; font-weight: 700; color: var(--accent-color);">${jpnvVenuesList.length}</div>
                        <div style="font-size: 0.7rem; color: var(--text-secondary); text-transform: uppercase; font-weight: 600;">Venues</div>
                    </div>
                    <div style="text-align: center;">
                        <div style="font-size: 1.5rem; font-weight: 700; color: var(--success-color);">${new Set(jpnvMatchSchedule.map(m => m.sport)).size}</div>
                        <div style="font-size: 0.7rem; color: var(--text-secondary); text-transform: uppercase; font-weight: 600;">Sports</div>
                    </div>
                </div>
            `;

            const nav = document.querySelector('.nav-container');
            nav.after(statsContainer);
        }

        // Initialize all features
        document.addEventListener('DOMContentLoaded', function() {
            initMobileFeatures();
            initNetworkMonitoring();
            trackPerformance();
            enhancedSearch();
            addQuickStats();
            
            // Enhanced loading with cache
            renderMatchesWithCache();
            
            // Cache other data
            setTimeout(() => {
                cacheData('teams', jpnvTeamsInformation);
                cacheData('venues', jpnvVenuesList);
                cacheData('results', jpnvMatchResults);
            }, 1000);
            
            console.log('✅ JPNV Sports Mobile App initialized successfully');
        });

        // Add CSS animations
        const animationCSS = `
            @keyframes slideDown {
                from { transform: translateX(-50%) translateY(-20px); opacity: 0; }
                to { transform: translateX(-50%) translateY(0); opacity: 1; }
            }
            @keyframes slideUp {
                from { transform: translateX(-50%) translateY(0); opacity: 1; }
                to { transform: translateX(-50%) translateY(-20px); opacity: 0; }
            }
        `;
        
        const style = document.createElement('style');
        style.textContent = animationCSS;
        document.head.appendChild(style);
    </script>
</body>
</html>
