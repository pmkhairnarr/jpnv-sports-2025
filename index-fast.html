<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏏 JPNV Sports 2025-26</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏏</text></svg>">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: system-ui, -apple-system, sans-serif;
            line-height: 1.5;
            color: #1f2937;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        
        .container { max-width: 1200px; margin: 0 auto; padding: 0 16px; }
        
        .header {
            background: rgba(255,255,255,0.95);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid #e5e7eb;
        }
        
        .header-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 0;
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.5rem;
            font-weight: 700;
            color: #2563eb;
            text-decoration: none;
        }
        
        .nav-menu { display: flex; gap: 8px; }
        
        .nav-btn {
            padding: 8px 16px;
            background: none;
            border: 2px solid #2563eb;
            border-radius: 8px;
            color: #2563eb;
            font-weight: 500;
            cursor: pointer;
            font-size: 14px;
        }
        
        .nav-btn:hover, .nav-btn.active {
            background: #2563eb;
            color: white;
        }
        
        .hero-section {
            text-align: center;
            padding: 40px 0;
            color: white;
            margin-bottom: 32px;
        }
        
        .hero-title {
            font-size: clamp(2rem, 5vw, 3.5rem);
            font-weight: 700;
            margin-bottom: 16px;
        }
        
        .hero-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 16px;
            max-width: 600px;
            margin: 0 auto;
        }
        
        .stat-card {
            background: rgba(255,255,255,0.2);
            padding: 16px;
            border-radius: 8px;
        }
        
        .stat-number { font-size: 2rem; font-weight: 700; color: #f59e0b; }
        .stat-label { font-size: 0.875rem; opacity: 0.9; }
        
        .content-section {
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            margin-bottom: 24px;
            overflow: hidden;
        }
        
        .section-header {
            background: linear-gradient(135deg, #2563eb, #1e40af);
            color: white;
            padding: 20px 24px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .filters {
            padding: 20px 24px;
            border-bottom: 1px solid #e5e7eb;
            background: #f8fafc;
        }
        
        .filter-tabs { display: flex; gap: 8px; flex-wrap: wrap; }
        
        .filter-tab {
            padding: 8px 16px;
            background: white;
            border: 2px solid #e5e7eb;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
        }
        
        .filter-tab:hover, .filter-tab.active {
            background: #2563eb;
            color: white;
            border-color: #2563eb;
        }
        
        .matches-grid {
            padding: 24px;
            display: grid;
            gap: 16px;
        }
        
        .match-card {
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            overflow: hidden;
            background: white;
        }
        
        .match-header {
            background: #f3f4f6;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .match-sport {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }
        
        .sport-cricket { background: #dbeafe; color: #1e40af; }
        .sport-football { background: #dcfce7; color: #166534; }
        .sport-basketball { background: #fed7aa; color: #c2410c; }
        .sport-tennis { background: #fce7f3; color: #be185d; }
        .sport-volleyball { background: #f0fdf4; color: #15803d; }
        .sport-badminton { background: #fef3c7; color: #d97706; }
        
        .match-content { padding: 16px; }
        
        .match-teams {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        
        .team { text-align: center; flex: 1; }
        .team-name { font-weight: 600; margin-bottom: 4px; }
        
        .team-logo {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #2563eb, #1e40af);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            margin: 0 auto 8px;
        }
        
        .vs-divider {
            font-weight: 700;
            color: #6b7280;
            margin: 0 16px;
        }
        
        .match-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            font-size: 14px;
            color: #6b7280;
        }
        
        .teams-grid {
            padding: 24px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }
        
        .team-card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
        }
        
        .team-card-logo {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #2563eb, #1e40af);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            font-size: 1.5rem;
            margin: 0 auto 16px;
        }
        
        @media (max-width: 768px) {
            .container { padding: 0 12px; }
            .hero-section { padding: 24px 0; }
            .matches-grid, .teams-grid { padding: 16px; }
            .match-details { grid-template-columns: 1fr; }
            .teams-grid { grid-template-columns: 1fr; }
            .match-teams { flex-direction: column; gap: 12px; }
            .vs-divider { margin: 8px 0; }
        }
        
        .loading { text-align: center; padding: 40px; color: #6b7280; }
    </style>
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="header-content">
                <a href="#" class="logo">
                    <span style="font-size: 2rem;">🏏</span>
                    <span>JPNV Sports</span>
                </a>
                <nav class="nav-menu">
                    <button class="nav-btn active" data-section="matches">Matches</button>
                    <button class="nav-btn" data-section="teams">Teams</button>
                    <button class="nav-btn" data-section="venues">Venues</button>
                </nav>
            </div>
        </div>
    </header>

    <main>
        <div class="container">
            <section class="hero-section">
                <h1 class="hero-title">🏆 JPNV Sports 2025-26</h1>
                <p style="font-size: clamp(1rem, 3vw, 1.5rem); margin-bottom: 24px;">Complete Multi-Sport Championship</p>
                <div class="hero-stats">
                    <div class="stat-card">
                        <div class="stat-number">24</div>
                        <div class="stat-label">Matches</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number">40</div>
                        <div class="stat-label">Teams</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number">6</div>
                        <div class="stat-label">Sports</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number">10</div>
                        <div class="stat-label">Venues</div>
                    </div>
                </div>
            </section>

            <section id="matches-section" class="content-section">
                <div class="section-header">
                    <span style="font-size: 1.5rem;">📅</span>
                    <h2 style="font-size: 1.5rem; font-weight: 600;">Match Schedule</h2>
                </div>
                
                <div class="filters">
                    <div class="filter-tabs">
                        <button class="filter-tab active" data-sport="all">All Sports</button>
                        <button class="filter-tab" data-sport="Cricket">🏏 Cricket</button>
                        <button class="filter-tab" data-sport="Football">⚽ Football</button>
                        <button class="filter-tab" data-sport="Basketball">🏀 Basketball</button>
                        <button class="filter-tab" data-sport="Tennis">🎾 Tennis</button>
                        <button class="filter-tab" data-sport="Volleyball">🏐 Volleyball</button>
                        <button class="filter-tab" data-sport="Badminton">🏸 Badminton</button>
                    </div>
                </div>

                <div class="matches-grid" id="matches-grid">
                    <div class="loading">📊 Loading matches...</div>
                </div>
            </section>

            <section id="teams-section" class="content-section" style="display: none;">
                <div class="section-header">
                    <span style="font-size: 1.5rem;">👥</span>
                    <h2 style="font-size: 1.5rem; font-weight: 600;">Teams</h2>
                </div>
                <div class="teams-grid" id="teams-grid"></div>
            </section>

            <section id="venues-section" class="content-section" style="display: none;">
                <div class="section-header">
                    <span style="font-size: 1.5rem;">🏟️</span>
                    <h2 style="font-size: 1.5rem; font-weight: 600;">Venues</h2>
                </div>
                <div class="teams-grid" id="venues-grid"></div>
            </section>
        </div>
    </main>

    <script>
        // Essential data only
        const matches = [
            {date: '2025-12-01', time: '09:00', sport: 'Cricket', competition: 'JPNV Premier League', homeTeam: 'Mumbai Warriors', awayTeam: 'Delhi Dynamos', venue: 'JPNV Cricket Ground A', status: 'Scheduled'},
            {date: '2025-12-01', time: '14:00', sport: 'Cricket', competition: 'JPNV Premier League', homeTeam: 'Kolkata Knights', awayTeam: 'Jaipur Jaguars', venue: 'JPNV Cricket Ground B', status: 'Scheduled'},
            {date: '2025-12-03', time: '10:00', sport: 'Football', competition: 'JPNV Football Championship', homeTeam: 'JPNV FC Lions', awayTeam: 'JPNV FC Tigers', venue: 'JPNV Football Stadium', status: 'Scheduled'},
            {date: '2025-12-05', time: '09:00', sport: 'Basketball', competition: 'JPNV Basketball Pro League', homeTeam: 'JPNV Ballers', awayTeam: 'JPNV Shooters', venue: 'JPNV Basketball Arena', status: 'Scheduled'},
            {date: '2025-12-06', time: '08:00', sport: 'Tennis', competition: 'JPNV Tennis Open', homeTeam: 'JPNV Aces', awayTeam: 'JPNV Serves', venue: 'JPNV Tennis Courts', status: 'Scheduled'},
            {date: '2025-12-07', time: '09:00', sport: 'Volleyball', competition: 'JPNV Volleyball League', homeTeam: 'JPNV Spikers', awayTeam: 'JPNV Blockers', venue: 'JPNV Indoor Sports Complex', status: 'Scheduled'},
            {date: '2025-12-08', time: '08:00', sport: 'Badminton', competition: 'JPNV Badminton Championship', homeTeam: 'JPNV Shuttlers', awayTeam: 'JPNV Smashers', venue: 'JPNV Badminton Hall', status: 'Scheduled'}
        ];

        const teams = [
            {name: 'Mumbai Warriors', sport: 'Cricket', contact: 'Rajesh Sharma', email: 'rajesh@jpnv.org'},
            {name: 'JPNV FC Lions', sport: 'Football', contact: 'Amit Kumar', email: 'amit@jpnv.org'},
            {name: 'JPNV Ballers', sport: 'Basketball', contact: 'Sanjay Mehta', email: 'sanjay@jpnv.org'},
            {name: 'JPNV Aces', sport: 'Tennis', contact: 'Kiran Desai', email: 'kiran@jpnv.org'},
            {name: 'JPNV Spikers', sport: 'Volleyball', contact: 'Sunil Pandey', email: 'sunil@jpnv.org'},
            {name: 'JPNV Shuttlers', sport: 'Badminton', contact: 'Arjun Negi', email: 'arjun@jpnv.org'}
        ];

        const venues = [
            {name: 'JPNV Cricket Ground A', city: 'Pune', capacity: 15000, surface: 'Natural Grass'},
            {name: 'JPNV Football Stadium', city: 'Pune', capacity: 25000, surface: 'Natural Grass'},
            {name: 'JPNV Basketball Arena', city: 'Pune', capacity: 5000, surface: 'Hardwood'},
            {name: 'JPNV Tennis Courts', city: 'Pune', capacity: 2000, surface: 'Hard Court'},
            {name: 'JPNV Indoor Sports Complex', city: 'Pune', capacity: 3000, surface: 'Synthetic'},
            {name: 'JPNV Badminton Hall', city: 'Pune', capacity: 1500, surface: 'Wooden'}
        ];

        function formatDate(dateString) {
            return new Date(dateString).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
        }

        function formatTime(timeString) {
            const [hours, minutes] = timeString.split(':');
            const time = new Date();
            time.setHours(hours, minutes);
            return time.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
        }

        function getInitials(name) {
            return name.split(' ').map(word => word[0]).join('').toUpperCase();
        }

        function getSportIcon(sport) {
            const icons = { 'Cricket': '🏏', 'Football': '⚽', 'Basketball': '🏀', 'Tennis': '🎾', 'Volleyball': '🏐', 'Badminton': '🏸' };
            return icons[sport] || '⚽';
        }

        function renderMatches(matchList = matches) {
            const grid = document.getElementById('matches-grid');
            grid.innerHTML = matchList.length === 0 ? '<div class="loading">No matches found.</div>' : matchList.map(match => `
                <div class="match-card">
                    <div class="match-header">
                        <span style="font-weight: 600;">${formatDate(match.date)}</span>
                        <span class="match-sport sport-${match.sport.toLowerCase()}">${getSportIcon(match.sport)} ${match.sport}</span>
                    </div>
                    <div class="match-content">
                        <div class="match-teams">
                            <div class="team">
                                <div class="team-logo">${getInitials(match.homeTeam)}</div>
                                <div class="team-name">${match.homeTeam}</div>
                            </div>
                            <div class="vs-divider">VS</div>
                            <div class="team">
                                <div class="team-logo">${getInitials(match.awayTeam)}</div>
                                <div class="team-name">${match.awayTeam}</div>
                            </div>
                        </div>
                        <div class="match-details">
                            <div>🕒 ${formatTime(match.time)}</div>
                            <div>🏟️ ${match.venue}</div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function renderTeams() {
            document.getElementById('teams-grid').innerHTML = teams.map(team => `
                <div class="team-card">
                    <div class="team-card-logo">${getInitials(team.name)}</div>
                    <div style="font-size: 1.25rem; font-weight: 600; margin-bottom: 8px;">${team.name}</div>
                    <div style="color: #6b7280; margin-bottom: 12px;">${getSportIcon(team.sport)} ${team.sport}</div>
                    <div style="font-size: 14px;">👤 ${team.contact}</div>
                    <div style="font-size: 14px;">📧 ${team.email}</div>
                </div>
            `).join('');
        }

        function renderVenues() {
            document.getElementById('venues-grid').innerHTML = venues.map(venue => `
                <div class="team-card">
                    <div class="team-card-logo">🏟️</div>
                    <div style="font-size: 1.25rem; font-weight: 600; margin-bottom: 8px;">${venue.name}</div>
                    <div style="color: #6b7280; margin-bottom: 12px;">${venue.city}</div>
                    <div style="font-size: 14px;">👥 Capacity: ${venue.capacity.toLocaleString()}</div>
                    <div style="font-size: 14px;">🌿 ${venue.surface}</div>
                </div>
            `).join('');
        }

        // Navigation
        document.querySelectorAll('.nav-btn').forEach(btn => {
            btn.onclick = function() {
                document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                
                document.querySelectorAll('.content-section').forEach(s => s.style.display = 'none');
                document.getElementById(this.dataset.section + '-section').style.display = 'block';
                
                if (this.dataset.section === 'teams') renderTeams();
                if (this.dataset.section === 'venues') renderVenues();
            };
        });

        // Sport filters
        document.querySelectorAll('.filter-tab').forEach(tab => {
            tab.onclick = function() {
                document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
                this.classList.add('active');
                
                const sport = this.dataset.sport;
                const filtered = sport === 'all' ? matches : matches.filter(match => match.sport === sport);
                renderMatches(filtered);
            };
        });

        // Load CSV data in background
        setTimeout(() => {
            const script = document.createElement('script');
            script.src = 'js/csv-loader-lite.js';
            script.async = true;
            document.head.appendChild(script);
        }, 100);

        // Initial render
        renderMatches();
    </script>
</body>
</html>
